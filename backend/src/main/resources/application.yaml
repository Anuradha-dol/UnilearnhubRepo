spring:
  application:
    name: website

  servlet:
    multipart:
      enabled: true
      max-file-size: 250MB
      max-request-size: 500MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/itpm_uni_learnhub_project}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from-address: ${MAIL_FROM:${MAIL_USERNAME:no-reply@unilearnhub.local}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}

  jwt:
    secret: ${JWT_SECRET:}

  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    domain: ${COOKIE_DOMAIN:}

server:
  port: ${SERVER_PORT:8081}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4173}

file:
  upload-dir: ${UPLOAD_DIR:uploads}
